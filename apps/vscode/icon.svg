<!-- The extension icon: a revised page under the product name, one line struck out and one inserted
     Rendered to icon.png at 128x128, which is what Visual Studio Code and the Pilot catalog show -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="revlens">
  <title>revlens</title>
  <desc>A white page on a blue tile, one line struck out and one inserted, under the name revlens</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- the page, with the corner folded -->
  <path d="M26 26 a6 6 0 0 1 6-6 h42 l20 20 v58 a6 6 0 0 1-6 6 H32 a6 6 0 0 1-6-6 Z" fill="#ffffff"/>
  <path d="M74 20 l20 20 h-16 a4 4 0 0 1-4-4 Z" fill="#c7dbfb"/>
  <!-- unchanged text, a deletion struck through, an insertion underlined -->
  <rect x="38" y="44" width="44" height="6" rx="3" fill="#9aa3ad"/>
  <rect x="38" y="60" width="40" height="6" rx="3" fill="#e2b7b0"/>
  <rect x="33" y="61.3" width="50" height="3.4" rx="1.7" fill="#a33a2c"/>
  <rect x="38" y="76" width="34" height="6" rx="3" fill="#1a7f5a"/>
  <rect x="38" y="86" width="34" height="4" rx="2" fill="#1a7f5a"/>
  <!-- the name, on a plate the page sits in -->
  <rect x="14" y="92" width="100" height="28" rx="10" fill="#0f326f"/>
  <text x="64" y="112" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.4">revlens</text>
</svg>
